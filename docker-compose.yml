services:
  talk:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "0.0.0.0:5000:5000"
    depends_on:
      - mongo
      - redis
    environment:
      - MONGODB_URI=mongodb://mongo:27017/coral
      - REDIS_URI=redis://redis:6379
      - SIGNING_SECRET=x6IL3gFQ2ja0A4XPmLzR2alAJldm++pazztMa6U95/8Fj4PuJFKWpZurrMan9B4f
  mongo:
    image: mongo:8.0.3
    restart: always
    volumes:
      - ./data/mongo:/data/db
  redis:
    image: redis:7.2.5
    restart: always
    volumes:
      - ./data/redis:/data
